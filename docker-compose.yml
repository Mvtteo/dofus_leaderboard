services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dofus_data:/var/lib/postgresql/data
  api:
    build: .
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
  bot:
    build: .
    restart: always
    command: python -m bot.main
    depends_on:
      - db
    env_file:
      - .env
volumes:
  dofus_data:
