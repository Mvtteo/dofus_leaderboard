services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: dofus_user
      POSTGRES_PASSWORD: grepallusi0
      POSTGRES_DB: dofus_db
    volumes:
      - dofus_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # 👇 C'est ICI qu'il faut le mettre (dans le service db) 👇
    ports:
      - "5432:5432"

  bot:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env

volumes:
  dofus_data: